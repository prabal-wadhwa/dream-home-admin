<div class="dashboard">
  <div class="stats">
    <app-stat-card
      *ngFor="let stat of stats"
      [title]="stat.title"
      [value]="stat.value"
      [growth]="stat.growth"
      [icon]="stat.icon"
      [color]="stat.color"
    ></app-stat-card>
  </div>
  <div class="charts">
    <div class="chart-card large">
      <div class="card-header">
        <h4>Sales over Time</h4>
        <button class="filter-btn">📅 This Month</button>
      </div>
      <div class="revenue-summary">
        <div class="summary-item current">
          <div class="dot blue"></div>

          <div class="content">
            <span class="label">This Month</span>
            <div class="value-row">
              <h3>${{ currentMonth.revenue }}</h3>
              <span class="growth">↑ {{ currentMonth.hike }}</span>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="summary-item last">
          <div class="dot light"></div>

          <div class="content">
            <span class="label">Last Month</span>
            <h3>${{ lastMonth.revenue }}</h3>
          </div>
        </div>
      </div>

      <div echarts [options]="revenueChart" class="chart"></div>
    </div>

    <div class="chart-card small">
      <div class="card-header">
        <h4>Sale by Property</h4>
        <button class="filter-btn">📅 This Month</button>
      </div>

      <div class="pie-wrapper">
        <div echarts [options]="statusChart" class="chart"></div>

        <div class="custom-legend">
          <div class="legend-item"><span class="dot green"></span> Villas</div>
          <div class="legend-item"><span class="dot blue"></span> Apartments</div>
          <div class="legend-item"><span class="dot orange"></span> Houses</div>
          <div class="legend-item"><span class="dot purple"></span> Commercial</div>
        </div>
      </div>
    </div>
  </div>
  <app-sale-reports-table [data]="topSoldProperties"></app-sale-reports-table>
</div>
