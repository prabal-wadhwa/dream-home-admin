<div class="table-card">
  <!-- <div class="table-header">
    <h3>Recent Bookings</h3>
    <button class="view-btn">View All Bookings</button>
  </div> -->

  <ngx-datatable
    class="custom-table"
    [rows]="data"
    [columnMode]="'force'"
    [scrollbarH]="true"
    [headerHeight]="50"
    [rowHeight]="70"
    [footerHeight]="60"
  >

    <!-- BOOKING ID -->
    <ngx-datatable-column name="Booking ID" prop="id" [width]="140"></ngx-datatable-column>

    <!-- PROPERTY -->
    <ngx-datatable-column name="Property" [width]="260">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="property">
          <img [src]="row.image" />
          <div>
            <strong>{{ row.title }}</strong>
            <span>{{ row.id }}</span>
          </div>
        </div>
      </ng-template>
    </ngx-datatable-column>

    <!-- TYPE -->
    <ngx-datatable-column name="Type" [width]="200">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="client">
          <span>{{ row.type }}</span>
        </div>
      </ng-template>
    </ngx-datatable-column>

    <!-- LOCATION -->
    <ngx-datatable-column name="Location" [width]="200">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="client">
          <span>{{ row.location }}</span>
        </div>
      </ng-template>
    </ngx-datatable-column>

      <!-- PRICE -->
    <ngx-datatable-column name="Prices" [width]="200">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="client">
          <span>${{ row.price | currency }}</span>
        </div>
      </ng-template>
    </ngx-datatable-column>

     <!-- STATUS -->
    <ngx-datatable-column name="Status" [width]="140">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="center-cell">
          <span class="status" [ngClass]="row.status.toLowerCase()">
            {{ row.status }}
          </span>
        </div>
      </ng-template>
    </ngx-datatable-column>

     <!-- FEATURED -->
    <ngx-datatable-column name="Featured" [width]="200">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="client">
          <!-- <span>{{ row.featured }}</span> -->
           <img [src]="row.featured ? '/icons/star-selected.png' : '/icons/star.png'" class="featured-icon" />
        </div>
      </ng-template>
    </ngx-datatable-column>

    <!-- DATE -->
    <ngx-datatable-column name="Added On" [width]="180">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="date">
          <span>{{ row.added_on }}</span>
          <!-- <small>{{ row.time }}</small> -->
        </div>
      </ng-template>
    </ngx-datatable-column>
      

    <!-- ACTIONS -->
    <ngx-datatable-column name="Actions" [width]="120">
      <ng-template ngx-datatable-cell-template>
        <div class="actions">
          <button class="icon-btn">👁</button>
          <button class="icon-btn">⋮</button>
        </div>
      </ng-template>
    </ngx-datatable-column>

  </ngx-datatable>
</div>
